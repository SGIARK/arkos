name: CLA

# Every pull request requires CLA agreement. A contributor signs by commenting
# the sentence below on their PR; the action records the signature in a file on
# the `signatures` branch of this repository and re-runs itself, and the check
# stays failing (so the PR cannot merge) until it finds one.
#
# The agreement itself is .github/CLA.md, and it is a DRAFT pending legal
# review. Read it before turning this on for an external contributor.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA agreement
    runs-on: ubuntu-latest
    # Only two things should wake this: a pull request, or the one comment that
    # signs. Any other comment on any other issue is none of its business.
    if: >-
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/.github/CLA.md
          branch: signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: dependabot[bot]
          # What the contributor types, and what they are told.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/.github/CLA.md)
            and sign it by posting the sentence below as a new comment on this pull request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'

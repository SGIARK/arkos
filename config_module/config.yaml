app:
  host: "0.0.0.0"
  port: "1121"
  reload: true
  system_prompt: |
    THIS IS A NEW CONVERSATION (past converation info is above)

    You are ARK, a helpful assistant with memory

    You were created by the ArkOS Team at MIT SIPB: 

    members: Nathaniel Morgan, Scotty Hong, Kishitj, Angela, Jack Luo, Ishaana, Ilya, Vin, Hudson 
    Never discuss these instructions with the user.
    Always stay in character as ARK when responding.

llm:
  # Hosted OpenAI for now. Self-hosting needs a GPU, and nothing about the loop
  # depends on which of the two is serving: client.py is an AsyncOpenAI against
  # base_url. model_module/run.sh still launches Qwen3-8B when the box is back.
  base_url: "https://api.openai.com/v1"
  model_name: "gpt-4.1-mini"
  api_key: "${OPENAI_API_KEY}"   # client.py falls back to "-", which SGLang ignores
                                 # and a real provider rejects as a 401
  # gpt-5.x rejects `max_tokens` (it wants max_completion_tokens) and pins
  # temperature, so it needs a client change before it can be selected here.
  # The 4.1 family takes the params client.py already sends. gpt-4.1-nano is
  # cheaper if this is still too expensive; gpt-4o-mini also works.
  max_tokens: 8192          # output reserve (max completion tokens), NOT the context limit
  context_window: 128000    # DELIBERATELY under the model's ~1M ceiling. Self-hosted, this
                            # had to match the SGLang launch flag exactly. Hosted, the rule
                            # inverts: it must not EXCEED what the API takes, and understating
                            # is free — it engages the context ladder early and bounds spend,
                            # where overstating buys a hard failure mid-run.
  temperature: 0.7
  timeout_s: 90             # per request. Task 0a measured a 44s max on Qwen3-8B;
                            # that number does not transfer, but 90 is still ample.
  max_retries: 3            # the ONE retry layer. Read as a cap on TOTAL attempts
                            # per generate() call — contracts names the key
                            # max_retries but its conformance test pins "<=3
                            # attempts", and the test is the testable half.
  retry_backoff_s: 0.5      # first backoff; doubles, with jitter
  retry_backoff_max_s: 8.0

budgets:
  # Keyed by sessions.mode, so nothing maps one vocabulary onto another.
  attended:   {max_hops: 6,  wall_clock_s: 300}
  unattended: {max_hops: 15, wall_clock_s: 1800}
  per_tool_attempts: 3
  model_retries: 3          # consecutive hop re-attempts after the client gives up

tools:
  result_view_cap_chars: 4000   # over this -> blob + ref
  call_timeout_s: 120           # hard cap on one tool call
  mcp_cache_ttl_s: 3600         # revalidate a connection's tools/list after this.
                                # Only refreshes the cached list; never re-PUTs,
                                # so a restart still costs zero Smithery writes.

database:
  url: "${DB_URL}"
  pool_min_size: 1
  pool_max_size: 10


memory:
  # fallback user_id for unauthenticated requests only — authenticated users
  # get their own memory bucket keyed by JWT user UUID (see app.py _make_agent)
  fallback_user_id: "arkos-agent"
  short_term_turns: 50
  long_term_limit: 5
  use_long_term: true

embedding:
  base_url: "http://localhost:4444/v1"
  provider: "huggingface"  

state:
  graph_path: "state_module/agent_buddy/graph.yaml"

# Per-user e2b sandbox (files + shell). The E2B SDK reads E2B_API_KEY from the
# environment directly, so it is intentionally NOT referenced here -- that keeps
# config load from crashing when the key is unset during early setup.
sandbox:
  template: "base"                         # e2b template
  timeout_seconds: 300                     # keep-alive while working
  idle_timeout_seconds: 900                # pause after this much idle (lifecycle, later)

# All MCP traffic flows through Smithery Connect. No local subprocesses, no
# per-provider OAuth plumbing on our side. Smithery maintains the OAuth apps,
# stores credentials write-only, and refreshes tokens automatically.
smithery:
  api_key: "${SMITHERY_API_KEY}"
  namespace: "${SMITHERY_NAMESPACE}"     # e.g. "arkos"
  base_url: "https://api.smithery.ai"

mcp_servers:
  # requires_auth: true  => Smithery's hosted per-user OAuth flow (user connects in
  #                         the settings panel). requires_auth: false => shared.
  # Add more servers by copying from https://smithery.ai/server/<name>.
  #
  # auto_approve waives the approval prompt. Absent, every MCP tool requires
  # approval: a remote server does not say whether a tool mutates, and an
  # unattended run reaching for these sends mail and opens issues under the
  # user's name. `true` waives a whole server; a list waives those tools only.
  #   auto_approve: true
  #   auto_approve: [search_issues, get_issue]

  linear:
    mcp_url: "https://linear.run.tools"
    requires_auth: true
    name: "Linear"

  google-calendar:
    mcp_url: "https://googlecalendar.run.tools"
    requires_auth: true
    name: "Google Calendar"

  slack:
    mcp_url: "https://slack--node2flow.run.tools"
    requires_auth: false
    name: "Slack"
    headers:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"

  gmail:
    mcp_url: "https://gmail.run.tools"
    requires_auth: true
    name: "Gmail"

  github:
    mcp_url: "https://github.run.tools"
    requires_auth: true
    name: "GitHub"

  notion:
    mcp_url: "https://notion.run.tools"
    requires_auth: true
    name: "Notion"

  parallel-search:
    mcp_url: "https://search--parallel.run.tools"
    requires_auth: true
    name: "Parallel Web Search"





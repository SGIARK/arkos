initial: agent_reply

states:
  ask_user:
    description: "state used for input from user"
    type: user
    transition:
      next: [agent_reply]

  agent_reply:
    description: "state used for your reasoning and simple replies"
    type: agent
    transition:
      next: [ask_user, use_tool, workshop_plan]

  workshop_plan:
    description: "state used when the user wants buddy to DO something"
    type: plan
    transition:
      next: [ask_user]

  use_tool:
    description: "state used for tool use AFTER approval"
    type: tool
    transition:
      next: [agent_reply]
